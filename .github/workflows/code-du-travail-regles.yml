# Chaque nuit, pour l'appli « Code du travail & Salaire net » :
# 1. récupère les dernières règles de calcul publiques (ministère du Travail, URSSAF), les vérifie avec les
#    moteurs de calcul de l'appli et les publie dans code-du-travail/regles/ si elles ont changé ;
# 2. surveille les articles de loi des calculs propres à l'appli (veille.json, lu par l'appli).
# Si une vérification échoue ou si un article surveillé change, le workflow échoue : GitHub envoie un e-mail.
name: Règles Code du travail

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Moteurs de calcul de l'appli
        run: npm install --prefix code-du-travail/outils --no-audit --no-fund
      - name: Vérification et préparation des règles
        run: node code-du-travail/outils/maj-regles.mjs
      - name: Veille des textes de loi
        id: veille
        if: ${{ !cancelled() }}
        run: node code-du-travail/outils/veille-lois.mjs
      - name: Publication
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain code-du-travail/regles)" ]; then
            git config user.name "Pocket & Play"
            git config user.email "playpocket.dev@gmail.com"
            git add code-du-travail/regles
            git commit -m "Code du travail : règles de calcul mises à jour"
            git push
          else
            echo "Rien de nouveau."
          fi
      - name: Alerte texte de loi modifié
        if: ${{ steps.veille.outputs.nouveau != '' }}
        run: |
          echo "::error::Article(s) modifié(s) : ${{ steps.veille.outputs.nouveau }}. Vérifier code-du-travail/regles/parametres.json, puis mettre à jour code-du-travail/outils/articles-surveilles.json."
          exit 1
